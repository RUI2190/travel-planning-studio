  if(!routeStops.length){list.innerHTML='<li class="empty">从任意地点详情中点“加入路线”，至少选择 2 个地点。</li>'}
  routeStops.forEach((s,i)=>{
    const li=document.createElement('li');li.className='route-stop';
    const num=document.createElement('span');num.className='num';num.textContent=i+1;
    const name=document.createElement('span');name.className='stop-name';name.textContent=s.name;
    const tools=document.createElement('span');tools.className='stop-tools';
    [['↑',-1,'上移'],['↓',1,'下移'],['×',0,'移除']].forEach(([label,delta,title])=>{const b=document.createElement('button');b.textContent=label;b.title=title;b.onclick=()=>delta?moveRouteStop(i,delta):removeRouteStop(i);tools.appendChild(b)});
    li.append(num,name,tools);list.appendChild(li);
    const icon=L.divIcon({className:'route-number-marker',html:`<div style="display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#294b3d;color:white;border:2px solid white;box-shadow:0 1px 6px #0006;font:800 11px sans-serif">${i+1}</div>`,iconSize:[22,22],iconAnchor:[11,11]});
    L.marker(gcjToMapLatLng(s.lat,s.lon),{icon,zIndexOffset:800,interactive:false}).addTo(routeStopLayer);
  });
  document.getElementById('routeCount').textContent=routeStops.length;
  document.getElementById('routeStopSummary').textContent=`路线地点（${routeStops.length}）`;
  document.getElementById('planRoute').disabled=routeStops.length<2||routeBusy;
}
function moveRouteStop(i,delta){const j=i+delta;if(j<0||j>=routeStops.length)return;[routeStops[i],routeStops[j]]=[routeStops[j],routeStops[i]];clearDrawnRoute();renderRouteStops();showRouteMessage('顺序已调整，请重新计算路线。',false)}
function removeRouteStop(i){routeStops.splice(i,1);clearDrawnRoute();renderRouteStops();showRouteMessage(routeStops.length?'地点已移除，请重新计算路线。':'',false)}
function clearDrawnRoute(){lastRouteSummary='';lastRouteCoords=[];if(routeLayer){map.removeLayer(routeLayer);routeLayer=null}}
function clearRoute(){routeStops=[];clearDrawnRoute();renderRouteStops();showRouteMessage('',false)}
function setRouteMode(mode){routeMode=mode;document.querySelectorAll('.route-mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));clearDrawnRoute();if(routeStops.length>1)showRouteMessage(`已切换为${routeModeNames[mode]}，请重新计算。`,false)}
function showRouteMessage(html,isError){const el=document.getElementById('routeResult');el.innerHTML=html;el.classList.toggle('show',!!html);el.classList.toggle('error',!!isError)}
function decodeValhallaShape(encoded){let index=0,lat=0,lon=0,coords=[];while(index<encoded.length){let b,shift=0,result=0;do{b=encoded.charCodeAt(index++)-63;result|=(b&31)<<shift;shift+=5}while(b>=32);lat+=(result&1)?~(result>>1):(result>>1);shift=0;result=0;do{b=encoded.charCodeAt(index++)-63;result|=(b&31)<<shift;shift+=5}while(b>=32);lon+=(result&1)?~(result>>1):(result>>1);coords.push([lat/1e6,lon/1e6])}return coords}
function formatDuration(seconds){const mins=Math.max(1,Math.round(seconds/60));return mins<60?`${mins} 分钟`:`${Math.floor(mins/60)} 小时${mins%60?` ${mins%60} 分`:''}`}
function formatDistance(km){return km<10?`${km.toFixed(1)} 公里`:`${Math.round(km)} 公里`}
async function planRoute(){
  if(routeBusy||routeStops.length<2)return;routeBusy=true;const btn=document.getElementById('planRoute');btn.disabled=true;btn.textContent='计算中…';showRouteMessage('正在沿实际道路计算，请稍候…',false);
  const payload={locations:routeStops.map(s=>{const [lon,lat]=gcj02ToWgs84(s.lon,s.lat);return{lat,lon}}),costing:routeMode,units:'kilometers',language:'zh-CN'};
  try{
    const res=await fetch('https://valhalla1.openstreetmap.de/route',{method:'POST',headers:{'Content-Type':'application/json','X-Client-Id':`${location.host}${location.pathname}`},body:JSON.stringify(payload)});
    const data=await res.json();if(!res.ok||!data.trip)throw new Error(data.error||data.status_message||'路线服务暂时不可用');
    const coords=data.trip.legs.flatMap((leg,i)=>{const points=decodeValhallaShape(leg.shape);return i?points.slice(1):points});
    clearDrawnRoute();lastRouteCoords=coords;routeLayer=L.polyline(coords.map(([lat,lon])=>wgsToMapLatLng(lat,lon)),{color:'#1769aa',weight:6,opacity:.82,lineJoin:'round'}).addTo(map);map.fitBounds(routeLayer.getBounds(),{padding:[42,42]});
    const s=data.trip.summary;lastRouteSummary=`${routeModeNames[routeMode]}路线｜${formatDistance(s.length)}｜约 ${formatDuration(s.time)}`;document.getElementById('routeStopsWrap').open=false;showRouteMessage(`<b>${routeModeNames[routeMode]}路线：${formatDistance(s.length)} · 约 ${formatDuration(s.time)}</b><br>${routeStops.length} 个地点，按当前顺序规划。${externalRouteLinks()}`,false);
  }catch(err){
    const transit=routeMode==='multimodal';showRouteMessage(`${transit?'当地开放公交时刻数据暂未覆盖，无法在页内生成可靠公交线路。':'路线暂时无法计算：'+err.message}${externalRouteLinks()}`,true);
  }finally{routeBusy=false;btn.textContent='计算路线';btn.disabled=routeStops.length<2}
}
function outOfChina(lon,lat){return lon<72.004||lon>137.8347||lat<0.8293||lat>55.8271}
function transformLat(x,y){return -100+2*x+3*y+.2*y*y+.1*x*y+.2*Math.sqrt(Math.abs(x))+(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3+(20*Math.sin(y*Math.PI)+40*Math.sin(y/3*Math.PI))*2/3+(160*Math.sin(y/12*Math.PI)+320*Math.sin(y*Math.PI/30))*2/3}
function transformLon(x,y){return 300+x+2*y+.1*x*x+.1*x*y+.1*Math.sqrt(Math.abs(x))+(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3+(20*Math.sin(x*Math.PI)+40*Math.sin(x/3*Math.PI))*2/3+(150*Math.sin(x/12*Math.PI)+300*Math.sin(x/30*Math.PI))*2/3}
function wgs84ToGcj02(lon,lat){if(outOfChina(lon,lat))return[lon,lat];const a=6378245,ee=.006693421622965943,dLat=transformLat(lon-105,lat-35),dLon=transformLon(lon-105,lat-35),rad=lat/180*Math.PI,magic=1-ee*Math.sin(rad)**2,sqrt=Math.sqrt(magic);return[lon+dLon*180/(a/sqrt*Math.cos(rad)*Math.PI),lat+dLat*180/(a*(1-ee)/(magic*sqrt)*Math.PI)]}
function gcj02ToWgs84(lon,lat){const [x,y]=wgs84ToGcj02(lon,lat);return[lon*2-x,lat*2-y]}
function switchToFallbackTiles(){if(usingFallbackTiles)return;usingFallbackTiles=true;const center=map.getCenter(),zoom=map.getZoom(),[lon,lat]=gcj02ToWgs84(center.lng,center.lat);mapUsesGcj=false;map.removeLayer(mainlandTiles);osmTiles.addTo(map);map.setView([lat,lon],zoom,{animate:false});markers.forEach((m,i)=>m.setLatLng(gcjToMapLatLng(pois[i].lat,pois[i].lon)));renderRouteStops();if(userLocationMarker&&lastUserLocationWgs)userLocationMarker.setLatLng(wgsToMapLatLng(...lastUserLocationWgs));if(routeLayer&&lastRouteCoords.length){map.removeLayer(routeLayer);routeLayer=L.polyline(lastRouteCoords.map(([lat,lon])=>wgsToMapLatLng(lat,lon)),{color:'#1769aa',weight:6,opacity:.82,lineJoin:'round'}).addTo(map)}}
function buildAmapRouteUrl(){if(routeStops.length<2)return'https://uri.amap.com';const modeMap={pedestrian:'walk',bicycle:'ride',auto:'car',multimodal:'bus'},fmt=s=>`${s.lon.toFixed(6)},${s.lat.toFixed(6)},${s.name}`,params=new URLSearchParams({from:fmt(routeStops[0]),to:fmt(routeStops[routeStops.length-1]),mode:modeMap[routeMode],policy:'0',src:'travel-planning-studio',callnative:'1'});if(routeMode==='auto'&&routeStops.length>2)params.set('via',fmt(routeStops[1]));return`https://uri.amap.com/navigation?${params}`}
function buildAppleRouteUrl(){if(routeStops.length<2)return'https://maps.apple.com';const start=gcj02ToWgs84(routeStops[0].lon,routeStops[0].lat),end=gcj02ToWgs84(routeStops[routeStops.length-1].lon,routeStops[routeStops.length-1].lat),modeMap={pedestrian:'w',auto:'d',multimodal:'r'},params=new URLSearchParams({saddr:`${start[1]},${start[0]}`,daddr:`${end[1]},${end[0]}`});if(modeMap[routeMode])params.set('dirflg',modeMap[routeMode]);return`https://maps.apple.com/?${params}`}
function externalRouteLinks(){return`<div class="external-links"><a href="${buildAmapRouteUrl()}" target="_blank" rel="noopener">高德继续</a><a class="apple" href="${buildAppleRouteUrl()}" target="_blank" rel="noopener">Apple 地图继续</a></div>`}
function copyRoute(){if(!routeStops.length)return alert('请先加入路线地点');const text=`${lastRouteSummary||routeModeNames[routeMode]+'路线'}\n\n地点顺序：\n`+routeStops.map((s,i)=>`${i+1}. ${s.name}\n${s.addr}`).join('\n\n')+`\n\n旅行地图：${location.href}`;copyText(text,'已复制路线清单（含出行方式、地点顺序、地址和地图链接）')}
let userLocationMarker=null,lastUserLocationWgs=null;
function locateMe(){if(!navigator.geolocation)return alert('浏览器不支持定位');navigator.geolocation.getCurrentPosition(pos=>{lastUserLocationWgs=[pos.coords.latitude,pos.coords.longitude];const ll=wgsToMapLatLng(...lastUserLocationWgs);if(userLocationMarker)userLocationMarker.setLatLng(ll);else userLocationMarker=L.circleMarker(ll,{radius:8,color:'#1769aa',fillOpacity:.8}).addTo(map).bindPopup('你的位置');userLocationMarker.openPopup();map.setView(ll,15)},err=>alert(err.code===1?'定位权限未开启，请在浏览器设置中允许访问位置。':'暂时无法获取位置，请稍后再试。'),{enableHighAccuracy:true,timeout:10000,maximumAge:30000});}
</script></body></html>
